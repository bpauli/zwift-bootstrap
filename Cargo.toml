[package]
name = "zwift-bootstrap"
version = "0.5.0"
edition = "2024"
description = "Install, update and start the Zwift game files on Linux with Wine"
license = "MIT OR Apache-2.0"
repository = "https://github.com/bpauli/zwift-bootstrap"
readme = "README.md"
keywords = ["zwift", "wine", "linux", "updater"]
categories = ["command-line-utilities", "games"]
# eframe 0.37 (1.95), std File::lock/try_lock (1.89).
rust-version = "1.95"

[dependencies]
# Blocking HTTP, rustls + webpki roots, gzip decode, redirects. No async runtime.
ureq = "3.4"
# SIMD CRC-32 (IEEE, the zlib crc32) that the protocol uses.
crc32fast = "1.5"
# Read-only DOM. A 5 MB manifest fits in memory; no streaming parser needed.
roxmltree = "0.21"
clap = { version = "4.6", features = ["derive"] }
# Encode manifest path segments for the URL.
percent-encoding = "2.3"
# syncfs(2) once before the ver_cur commit point, instead of 19777 fsyncs.
rustix = { version = "1.1", features = ["fs"] }
thiserror = "2.0"
bluer = { version = "0.17", features = ["bluetoothd"] }
tokio = { version = "1", features = ["rt", "net", "io-util", "sync", "time", "macros"] }
futures-util = "0.3"
libc = "0.2"
eframe = { version = "0.37", default-features = false, features = ["glow", "wayland", "x11", "default_fonts"] }
# The GPU test of `launch`: EGL bindings, libEGL loaded at run time, OpenGL. Already in the
# graph through eframe.
glutin_egl_sys = "0.7"
libloading = "0.8"
glow = "0.17"

[dev-dependencies]
# Fake CDN in tests: blocking, per-request control for fault injection.
tiny_http = "0.12"
tempfile = "3.27"
# Gzip the fake CDN's XML like CloudFront. Already in the graph through ureq.
flate2 = "1.1"

[package.metadata.deb]
maintainer = "Burkhard Pauli <burkhard@pauli.tech>"
copyright = "2026, Burkhard Pauli"
extended-description = """\
Unofficial native Linux launcher for Zwift. Installs and updates the Zwift \
game files from the Zwift CDN with length and CRC-32 checks, and starts \
ZwiftApp.exe with Wine."""
section = "games"
priority = "optional"
depends = "$auto, libcap2-bin"
suggests = "wine, libnotify-bin"
maintainer-scripts = "debian/"
assets = [
    ["target/release/zwift-bootstrap", "usr/bin/", "755"],
    ["target/release/zwift-bootstrap-ble", "usr/bin/", "755"],
    ["contrib/zwift-start", "usr/bin/", "755"],
    ["contrib/zwift.desktop", "usr/share/applications/zwift-bootstrap.desktop", "644"],
    ["README.md", "usr/share/doc/zwift-bootstrap/README.md", "644"],
]
