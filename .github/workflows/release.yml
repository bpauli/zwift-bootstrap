name: release

on:
  push:
    tags:
      - "v*"
  # A test build without a release.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    # Ubuntu 22.04 has the oldest glibc (2.35) of the supported systems, so the
    # binary runs on Debian 12, Ubuntu 22.04 and later. A container, because the
    # ubuntu-22.04 runner image is retired.
    container: ubuntu:22.04
    steps:
      - name: Install build tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends build-essential ca-certificates curl gcc-mingw-w64-x86-64 git jq libdbus-1-dev pkg-config rpm

      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deb,cargo-generate-rpm

      - name: Read the version
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          echo "VERSION=${version}" >> "${GITHUB_ENV}"

      - name: Check that the tag matches Cargo.toml
        if: github.ref_type == 'tag'
        run: test "v${VERSION}" = "${GITHUB_REF_NAME}"

      - run: cargo deb --locked

      # The builtin auto-req uses ldd, which also lists the libraries of libdbus. find-requires
      # lists only the libraries that the binaries link, as rpmbuild does.
      - run: cargo generate-rpm --auto-req find-requires

      - name: Package
        run: |
          name="zwift-bootstrap_${VERSION}_linux_amd64"
          mkdir -p "dist/contrib"
          cp target/release/zwift-bootstrap target/release/zwift-bootstrap-ble README.md LICENSE-MIT LICENSE-APACHE dist/
          cp contrib/zwift-start contrib/zwift.desktop contrib/zwift.png dist/contrib/
          tar czf "${name}.tar.gz" -C dist .
          cp target/debian/zwift-bootstrap_*_amd64.deb .
          dpkg-deb --field zwift-bootstrap_*_amd64.deb Depends
          cp target/generate-rpm/zwift-bootstrap-*.x86_64.rpm .
          rpm -qpR zwift-bootstrap-*.x86_64.rpm
          sha256sum "${name}.tar.gz" zwift-bootstrap_*_amd64.deb zwift-bootstrap-*.x86_64.rpm > checksums.txt

      - uses: actions/upload-artifact@v4
        with:
          name: release
          path: |
            zwift-bootstrap_*_linux_amd64.tar.gz
            zwift-bootstrap_*_amd64.deb
            zwift-bootstrap-*.x86_64.rpm
            checksums.txt
          if-no-files-found: error

  release:
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release

      - name: Create the GitHub release
        run: gh release create "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --title "${GITHUB_REF_NAME}" --generate-notes zwift-bootstrap_*_linux_amd64.tar.gz zwift-bootstrap_*_amd64.deb zwift-bootstrap-*.x86_64.rpm checksums.txt
        env:
          GH_TOKEN: ${{ github.token }}

  update-aur:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Trigger aur-packages update
        run: |
          if [ -z "${GH_TOKEN}" ]; then
            echo "::warning::TAP_GITHUB_TOKEN is not set, so the AUR package is not updated"
            exit 0
          fi
          gh workflow run update-package.yml \
            --repo bpauli/aur-packages \
            --field package=zwift-bootstrap-bin \
            --field tag=${GITHUB_REF_NAME} \
            --field repository=bpauli/zwift-bootstrap
        env:
          GH_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}

  update-apt:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Trigger apt-packages update
        run: |
          if [ -z "${GH_TOKEN}" ]; then
            echo "::warning::TAP_GITHUB_TOKEN is not set, so the APT package is not updated"
            exit 0
          fi
          gh workflow run update-package.yml \
            --repo bpauli/apt-packages \
            --field package=zwift-bootstrap \
            --field tag=${GITHUB_REF_NAME} \
            --field repository=bpauli/zwift-bootstrap
        env:
          GH_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
