name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    # The oldest supported runner, so the binary runs with glibc 2.35 and later
    # (Debian 12, Ubuntu 22.04).
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deb

      - name: Check that the tag matches Cargo.toml
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          test "v${version}" = "${GITHUB_REF_NAME}"

      - run: cargo deb --locked

      - name: Package
        run: |
          name="zwift-bootstrap_${GITHUB_REF_NAME#v}_linux_amd64"
          mkdir -p "dist/contrib"
          cp target/release/zwift-bootstrap README.md LICENSE-MIT LICENSE-APACHE dist/
          cp contrib/zwift-start contrib/zwift.desktop dist/contrib/
          tar czf "${name}.tar.gz" -C dist .
          cp target/debian/zwift-bootstrap_*_amd64.deb .
          dpkg-deb --field zwift-bootstrap_*_amd64.deb Depends
          sha256sum "${name}.tar.gz" zwift-bootstrap_*_amd64.deb > checksums.txt

      - name: Create the GitHub release
        run: gh release create "${GITHUB_REF_NAME}" --title "${GITHUB_REF_NAME}" --generate-notes zwift-bootstrap_*_linux_amd64.tar.gz zwift-bootstrap_*_amd64.deb checksums.txt
        env:
          GH_TOKEN: ${{ github.token }}

  update-aur:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Trigger aur-packages update
        run: |
          if [ -z "${GH_TOKEN}" ]; then
            echo "::warning::TAP_GITHUB_TOKEN is not set, so the AUR package is not updated"
            exit 0
          fi
          gh workflow run update-package.yml \
            --repo bpauli/aur-packages \
            --field package=zwift-bootstrap-bin \
            --field tag=${GITHUB_REF_NAME} \
            --field repository=bpauli/zwift-bootstrap
        env:
          GH_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}

  update-apt:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Trigger apt-packages update
        run: |
          if [ -z "${GH_TOKEN}" ]; then
            echo "::warning::TAP_GITHUB_TOKEN is not set, so the APT package is not updated"
            exit 0
          fi
          gh workflow run update-package.yml \
            --repo bpauli/apt-packages \
            --field package=zwift-bootstrap \
            --field tag=${GITHUB_REF_NAME} \
            --field repository=bpauli/zwift-bootstrap
        env:
          GH_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
